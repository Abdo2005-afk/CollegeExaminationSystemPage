<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create / Manage Exams</title>
    <link rel="stylesheet" href="create_exams.css" />
  </head>
  <body>
    <header>
      <h1>College Examination Management System</h1>
      <p>Welcome Lecturer</p>
    </header>

    <nav>
      <a href="home.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="lecturer.html">Lecturer</a>
      <a href="student.html">Student</a>
      <a href="login.html">Login</a>
    </nav>

    <section class="hero">
      <h2>Create / Manage Exams</h2>
      <p>Fill the exam details below</p>
    </section>

    <div class="form-container">
      <form>
        <label>Exam Title</label>
        <input type="text" placeholder="Enter exam title" />

        <label>Course Name</label>
        <input type="text" placeholder="Enter course name" />

        <label>Exam Date</label>
        <input type="date" />

        <label>Duration (Minutes)</label>
        <input type="number" placeholder="Example: 60" />

        <label>Total Marks</label>
        <input type="number" placeholder="Example: 100" />

        <button class="btn">Create Exam</button>
      </form>
    </div>

    <footer>
      <p>© 2025-2026 College Examination System</p>
    </footer>
  </body>
</html>
