<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Update Profile</title>
    <link rel="stylesheet" href="update_profile.css" />
  </head>
  <body>
    <header>
      <h1>College Examination Management System</h1>
      <p>Welcome Lecturer</p>
    </header>

    <nav>
      <a href="home.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="lecturer.html">Lecturer</a>
      <a href="student.html">Student</a>
      <a href="login.html">Login</a>
    </nav>

    <section class="hero">
      <h2>Update Profile</h2>
      <p>Edit your account information</p>
    </section>

    <div class="form-container">
      <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" />

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" />

        <label>Username</label>
        <input type="text" placeholder="Enter username" />

        <label>New Password</label>
        <input type="password" placeholder="Enter new password" />

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password" />

        <button class="btn">Update Profile</button>
      </form>
    </div>

    <footer>
      <p>© 2025-2026 College Examination System</p>
    </footer>
  </body>
</html>
