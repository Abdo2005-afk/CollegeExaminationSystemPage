<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Re-evaluation Request</title>
    <link rel="stylesheet" href="take-exam.css">
</head>
<body>


<header>
    <h1>College Examination Management System</h1>
    <p>Re-evaluation Request</p>
</header>

<nav>
    <a href="student.html" class="btn">Back to Student Panel</a>
</nav>

<section class="hero">
    <h2>Submit Re-evaluation Request</h2>
    <p>Fill in the details for the subject you want to request re-evaluation for.</p>
</section>

<div class="form-container">
    <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <label for="roll">Roll Number:</label>
        <input type="number" id="roll" name="roll" placeholder="Enter your roll number">

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter subject name">

        <label for="reason">Reason for Re-evaluation:</label>
        <textarea id="reason" name="reason" placeholder="Enter your reason"></textarea>

        <button type="button" class="btn">Submit Request</button>
    </form>
</div>

<footer>
    <p>© 2025-2026 College Examination System</p>
</footer>


</body>
</html>
