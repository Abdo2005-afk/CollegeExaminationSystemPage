<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add / Edit Questions</title>
    <link rel="stylesheet" href="add_questions.css" />
  </head>
  <body>
    <header>
      <h1>College Examination Management System</h1>
      <p>Welcome Lecturer</p>
    </header>

    <nav>
      <a href="home.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="lecturer.html">Lecturer</a>
      <a href="student.html">Student</a>
      <a href="login.html">Login</a>
    </nav>

    <section class="hero">
      <h2>Add / Edit Questions</h2>
      <p>Fill the question details below</p>
    </section>

    <div class="form-container">
      <form>
        <label>Question Title</label>
        <input type="text" placeholder="Enter question text" />

        <label>Option A</label>
        <input type="text" placeholder="Enter option A" />

        <label>Option B</label>
        <input type="text" placeholder="Enter option B" />

        <label>Option C</label>
        <input type="text" placeholder="Enter option C" />

        <label>Option D</label>
        <input type="text" placeholder="Enter option D" />

        <label>Correct Answer</label>
        <select>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>

        <button class="btn">Add Question</button>
      </form>
    </div>

    <footer>
      <p>© 2025-2026 College Examination System</p>
    </footer>
  </body>
</html>
