<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Give Feedback</title>
    <link rel="stylesheet" href="take-exam.css">
</head>
<body>

```
<header>
    <h1>College Examination Management System</h1>
    <p>Give Feedback</p>
</header>

<nav>
    <a href="student.html" class="btn">Back to Student Panel</a>
</nav>

<section class="hero">
    <h2>Feedback Form</h2>
    <p>Provide your feedback or suggestions below.</p>
</section>

<div class="form-container">
    <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <label for="roll">Roll Number:</label>
        <input type="number" id="roll" name="roll" placeholder="Enter your roll number">

        <label for="feedback">Feedback:</label>
        <textarea id="feedback" name="feedback" placeholder="Enter your feedback"></textarea>

        <button type="button" class="btn">Submit Feedback</button>
    </form>
</div>

<footer>
    <p>© 2025-2026 College Examination System</p>
</footer>
```

</body>
