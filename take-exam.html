<header>
    <h1>College Examination Management System</h1>
    <p>Take Exam</p>

<nav>
    <a href="student.html" class="btn">Back to Student Panel</a>

        <label for="q2">Question 2: Explain your favorite programming language.</label>
        <textarea id="q2" name="q2" placeholder="Your answer"></textarea>

        <button type="button" class="btn">Submit Answers</button>
    </form>
</div>

    <p>© 2025-2026 College Examination System</p>
</footer>
