<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Profile</title>
    <link rel="stylesheet" href="take-exam.css">
</head>
<body>


<header>
    <h1>College Examination Management System</h1>
    <p>Update Profile</p>
</header>

<nav>
    <a href="student.html" class="btn">Back to Student Panel</a>
</nav>

<section class="hero">
    <h2>Update Your Profile</h2>
    <p>Modify your personal information below.</p>
</section>

<div class="form-container">
    <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <label for="roll">Roll Number:</label>
        <input type="number" id="roll" name="roll" placeholder="Enter your roll number">

        <label for="email">Email:</label>
        <input type="text" id="email" name="email" placeholder="Enter your email address">

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" placeholder="Enter your phone number">

        <button type="button" class="btn">Update Profile</button>
    </form>
</div>

<footer>
    <p>© 2025-2026 College Examination System</p>
</footer>


</body>
</html>
