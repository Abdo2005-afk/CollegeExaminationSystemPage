<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Generate Reports</title>
    <link rel="stylesheet" href="reports.css" />
  </head>
  <body>
    <header>
      <h1>College Examination Management System</h1>
      <p>Welcome Lecturer</p>
    </header>

    <nav>
      <a href="home.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="lecturer.html">Lecturer</a>
      <a href="student.html">Student</a>
      <a href="login.html">Login</a>
    </nav>

    <section class="hero">
      <h2>Generate Reports</h2>
      <p>Select report type and exam</p>
    </section>

    <div class="form-container">
      <form>
        <label>Select Report Type</label>
        <select>
          <option value="">Choose report type...</option>
          <option>Students Grades Report</option>
          <option>Exam Summary Report</option>
          <option>Exam Performance Analysis</option>
        </select>

        <label>Select Exam</label>
        <select>
          <option value="">Choose exam...</option>
          <option>Quiz 1</option>
          <option>Quiz 2</option>
          <option>Midterm Exam</option>
          <option>Final Exam</option>
        </select>

        <button class="btn">Generate</button>
      </form>
    </div>

    <footer>
      <p>© 2025-2026 College Examination System</p>
    </footer>
  </body>
</html>
